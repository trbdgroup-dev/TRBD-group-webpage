# CI (task F2): every pull request and every push to main runs the same checks
# as local development, against a throwaway Postgres with the seeded content.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trbd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values: a throwaway database, disk storage instead of Supabase,
    # and secrets that exist only for this run. Never production values.
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/trbd
      PAYLOAD_SECRET: ci-only-payload-secret-not-used-anywhere-else
      PREVIEW_SECRET: ci-only-preview-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STORAGE_DRIVER: local
      SEED_ADMIN_EMAIL: admin@trbdgroup.test
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same npm as local development. Node 22 ships npm 10, which rejects a
      # lockfile written by npm 11 when it leaves out other platforms' optional
      # packages (it failed on @emnapi/core, needed by sharp's WebAssembly build).
      - name: Use npm 11
        run: npm install -g npm@11.6.2

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Payload types are up to date
        run: |
          npm run generate:types
          git diff --exit-code -- src/payload-types.ts || {
            echo "::error::src/payload-types.ts is out of date. Run 'npm run generate:types' and commit."
            exit 1
          }

      - name: Unit tests
        run: npm test

      - name: Database migrations
        run: npm run migrate

      - name: Migrations match the config
        run: |
          # With no schema changes Payload asks "create a blank migration?" and we
          # answer no (exit 0). A real schema change writes a migration file, which
          # fails the check below. A broken config exits non-zero and fails the step.
          echo n | npm run migrate:create -- ci-schema-check
          if [ -n "$(git status --porcelain -- src/migrations)" ]; then
            echo "::error::The Payload config has schema changes without a migration. Run 'npm run migrate:create' and commit."
            exit 1
          fi

      - name: Seed content
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
